name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go mod tidy
      - run: gofmt -w ./cmd ./internal
      - run: git diff -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...
