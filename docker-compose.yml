services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://quantzen:quantzen@postgres:5432/quantzen?sslmode=disable
    depends_on: [postgres, redis]
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: quantzen
      POSTGRES_USER: quantzen
      POSTGRES_PASSWORD: quantzen
    ports: ["5432:5432"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
