services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      DATABASE_URL: "postgres://quantzen:${POSTGRES_PASSWORD}@postgres:5432/quantzen?sslmode=disable"
    depends_on: [postgres, redis]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: quantzen
      POSTGRES_USER: quantzen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    ports:
      - "127.0.0.1:6379:6379"
